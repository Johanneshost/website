<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonard Philp · Industrial Design Portfolio</title>
<meta name="description" content="Portfolio of Leonard Philp, industrial design student at HTW Berlin: transportation design, product design and automotive tape rendering.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --dark:#111111; --light:#F3F2EE; --grey:#8A8A86; --accent:#D9532B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#000; color:#fff; font-family:Inter, system-ui, sans-serif; }
  .label { font-family:"JetBrains Mono", monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  header { padding:24px clamp(16px,4vw,48px); }
  .hero { min-height:100vh; display:flex; flex-direction:column; justify-content:center; gap:28px; padding:0 clamp(16px,4vw,48px) 48px; }
  h1 { font-family:"Inter Tight", sans-serif; font-weight:700; letter-spacing:-.03em; line-height:.9; font-size:clamp(56px,13vw,200px); }
  .sub { max-width:560px; color:var(--grey); font-size:clamp(16px,1.6vw,20px); line-height:1.45; }
  .hero img { width:100%; height:auto; display:block; margin-top:24px; }
</style>
</head>
<body>
  <header class="label">Leonard Philp</header>
  <main class="hero">
    <p class="label">Industrial Design Portfolio</p>
    <h1>Leonard Philp</h1>
    <p class="sub">Industrial design student at HTW Berlin. Transportation, product and the space between business and form.</p>
    <img src="bilder/hero.jpg" alt="Full-scale automotive tape rendering of the sports car Nilu 27 by Leonard Philp" width="2200" height="633">
  </main>
</body>
</html>
